name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: python -m ruff check custom_components tests
      - run: python -m ruff format --check custom_components tests
      - run: >-
          python -m pytest -q
          --cov=custom_components.alarme_personnalisee
          --cov-report=term-missing
          --cov-fail-under=95
